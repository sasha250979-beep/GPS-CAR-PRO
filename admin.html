<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ-панель GPS CAR PRO</title><link rel="stylesheet" href="style.css"><style>
.admin{max-width:900px;margin:34px auto;background:#fff;padding:24px;border-radius:18px;box-shadow:0 8px 30px #001b3b15}.admin h1,.admin h2{color:#061b43}.admin label{display:block;font-weight:bold;margin:13px 0 6px}.admin input,.admin textarea{width:100%;padding:12px;border:1px solid #cbd9e8;border-radius:10px;font:inherit}.admin textarea{min-height:110px}.admin button{border:0;border-radius:25px;padding:12px 18px;background:#0754b8;color:white;font-weight:bold;margin:10px 8px 10px 0}.admin button.secondary{background:#e7eff9;color:#061b43}.admin .danger{background:#c83b3b}.rowitem{padding:14px;border:1px solid #dce7f3;border-radius:12px;margin:10px 0}.hidden{display:none}.note{color:#60718a;font-size:14px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:600px){.formgrid{grid-template-columns:1fr}}
</style><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><div class="wrap nav"><a class="logo" href="index.html">GPS <b>CAR PRO</b><small>ПАНЕЛЬ АДМИНИСТРАТОРА</small></a><a class="phone" href="index.html">На сайт</a></div></header>
<main class="wrap"><div class="admin"><section id="login"><h1>Вход администратора</h1><p class="note">Войти может только владелец сайта.</p><label>Email</label><input id="email" type="email" value="alarmservis2509@gmail.com" autocomplete="username"><label>Пароль</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">Войти</button><p id="loginMsg" class="note"></p></section>
<section id="panel" class="hidden"><h1>Управление сайтом</h1><p class="note" id="who"></p><button class="secondary" id="logout">Выйти</button>
<h2>Добавить статью</h2><form id="articleForm"><div class="formgrid"><div><label>Заголовок (RU)</label><input id="title_ru" required></div><div><label>Titlu (RO)</label><input id="title_ro"></div><div><label>Краткое описание (RU)</label><textarea id="excerpt_ru"></textarea></div><div><label>Descriere scurtă (RO)</label><textarea id="excerpt_ro"></textarea></div></div><label>Текст статьи (RU)</label><textarea id="body_ru" required></textarea><label>Text articol (RO)</label><textarea id="body_ro"></textarea><label>Обложка статьи (фото)</label><input id="cover" type="file" accept="image/*"><label><input id="published" type="checkbox" checked style="width:auto"> Опубликовать сразу</label><button type="submit">Сохранить статью</button></form><p id="articleMsg" class="note"></p><div id="articles"></div>
<hr><h2>Добавить фото в галерею</h2><form id="galleryForm"><div class="formgrid"><div><label>Название (RU)</label><input id="galleryTitleRu"></div><div><label>Titlu (RO)</label><input id="galleryTitleRo"></div></div><label>Выбрать фото</label><input id="galleryFile" type="file" accept="image/*" required><button type="submit">Загрузить фото</button></form><p id="galleryMsg" class="note"></p><div id="galleryItems"></div></section></div></main>
<script>
const cfg=GPS_CONFIG;const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey);const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const slug=s=>(s||'article').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Date.now();
function showPanel(user){$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('who').textContent='Вы вошли как '+user.email;loadAdminData()}
async function check(){const {data:{user}}=await sb.auth.getUser();if(user&&user.email===cfg.adminEmail)showPanel(user)}
$('loginBtn').onclick=async()=>{ $('loginMsg').textContent='Проверяем вход…';const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').textContent='Ошибка входа: '+error.message;return;}if(data.user.email!==cfg.adminEmail){await sb.auth.signOut();$('loginMsg').textContent='Этот аккаунт не имеет доступа.';return;}showPanel(data.user)};
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function upload(file,prefix){if(!file)return null;const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=prefix+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;const {error}=await sb.storage.from(cfg.bucket).upload(path,file,{upsert:false,contentType:file.type||'image/jpeg'});if(error)throw error;return sb.storage.from(cfg.bucket).getPublicUrl(path).data.publicUrl}
$('articleForm').onsubmit=async e=>{e.preventDefault();$('articleMsg').textContent='Сохраняем…';try{const cover=await upload($('cover').files[0],'articles');const payload={slug:slug($('title_ru').value),title_ru:$('title_ru').value,title_ro:$('title_ro').value,excerpt_ru:$('excerpt_ru').value,excerpt_ro:$('excerpt_ro').value,body_ru:$('body_ru').value,body_ro:$('body_ro').value,cover_image:cover,published:$('published').checked};const {error}=await sb.from('site_articles').insert(payload);if(error)throw error;$('articleMsg').textContent='Статья сохранена.';$('articleForm').reset();$('published').checked=true;loadAdminData()}catch(err){$('articleMsg').textContent='Не удалось сохранить: '+err.message}};
$('galleryForm').onsubmit=async e=>{e.preventDefault();$('galleryMsg').textContent='Загружаем…';try{const url=await upload($('galleryFile').files[0],'gallery');const {error}=await sb.from('site_gallery').insert({title_ru:$('galleryTitleRu').value,title_ro:$('galleryTitleRo').value,image_path:url});if(error)throw error;$('galleryMsg').textContent='Фото добавлено в галерею.';$('galleryForm').reset();loadAdminData()}catch(err){$('galleryMsg').textContent='Ошибка: '+err.message}};
async function loadAdminData(){const {data:arts}=await sb.from('site_articles').select('*').order('created_at',{ascending:false});$('articles').innerHTML='<h3>Статьи на сайте</h3>'+(arts||[]).map(a=>`<div class="rowitem"><b>${esc(a.title_ru)}</b> — ${a.published?'Опубликована':'Черновик'}<br><button class="secondary" onclick="toggleArticle('${a.id}',${!a.published})">${a.published?'Снять с публикации':'Опубликовать'}</button><button class="danger" onclick="deleteArticle('${a.id}')">Удалить</button></div>`).join('');const {data:imgs}=await sb.from('site_gallery').select('*').order('created_at',{ascending:false});$('galleryItems').innerHTML='<h3>Фотографии в галерее</h3>'+(imgs||[]).map(g=>`<div class="rowitem"><img src="${esc(g.image_path)}" style="width:100px;height:70px;object-fit:cover;border-radius:8px;vertical-align:middle"> ${esc(g.title_ru||'Фото')} <button class="danger" onclick="deleteGallery('${g.id}')">Удалить</button></div>`).join('')}
window.toggleArticle=async(id,published)=>{const {error}=await sb.from('site_articles').update({published}).eq('id',id);if(error)alert(error.message);loadAdminData()};window.deleteArticle=async id=>{if(confirm('Удалить статью?')){const {error}=await sb.from('site_articles').delete().eq('id',id);if(error)alert(error.message);loadAdminData()}};window.deleteGallery=async id=>{if(confirm('Удалить фото из галереи?')){const {error}=await sb.from('site_gallery').delete().eq('id',id);if(error)alert(error.message);loadAdminData()}};check();
</script></body></html>
