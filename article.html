<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Статья — GPS CAR PRO</title><link rel="stylesheet" href="style.css"><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><div class="wrap nav"><a class="logo" href="index.html">GPS <b>CAR PRO</b></a><a class="phone" href="tel:+37376829080">076 829 080</a></div></header><main class="wrap section"><article id="article" class="article-body"><p>Загружаем статью…</p></article></main><footer><div class="wrap">© GPS CAR PRO</div></footer><script>
const sb=window.supabase.createClient(GPS_CONFIG.supabaseUrl,GPS_CONFIG.supabaseKey);const id=new URLSearchParams(location.search).get('id');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));(async()=>{const {data,error}=await sb.from('site_articles').select('*').eq('id',id).eq('published',true).single();const el=document.getElementById('article');if(error||!data){el.innerHTML='<h1>Статья не найдена</h1>';return;}el.innerHTML=(data.cover_image?`<img style="width:100%;max-height:420px;object-fit:cover;border-radius:18px" src="${esc(data.cover_image)}">`: '')+`<h1>${esc(data.title_ru)}</h1><p>${esc(data.excerpt_ru)}</p><div style="white-space:pre-wrap;line-height:1.8">${esc(data.body_ru)}</div><p><a class="read" href="index.html#articles">← Все статьи</a></p>`})();</script></body></html>
